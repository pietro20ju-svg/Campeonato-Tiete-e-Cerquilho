<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campeonato Tietê & Cerquilho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root{
    --onyx:#121014;
    --onyx-deep:#09080A;
    --charcoal:#1D1A1C;
    --charcoal-2:#242024;
    --gold:#D4AF37;
    --gold-bright:#F0CE63;
    --gold-dim:#8A6D22;
    --gold-line:rgba(212,175,55,0.35);
    --cream:#F3EEDD;
    --cream-soft:#C9C2B4;
    --danger:#C0483A;
    --danger-bright:#E1786A;
    --teal:#3F8FA6;
    --teal-bright:#63B4CC;
    --radius:9px;

    --bs-body-bg:var(--onyx);
    --bs-body-color:var(--cream);
    --bs-border-color:var(--gold-line);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 50% 0%, rgba(212,175,55,0.08), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(212,175,55,0.05), transparent 50%),
      var(--onyx);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    font-size:16.5px;
    min-height:100vh;
    padding-bottom:90px;
  }
  .display{font-family:'Cinzel', serif;}
  a{color:var(--gold-bright);}

  /* ---------- Navbar / brand ---------- */
  .champ-navbar{
    background:linear-gradient(180deg, var(--onyx-deep), var(--charcoal));
    border-bottom:2px solid var(--gold);
    box-shadow:0 2px 18px rgba(0,0,0,0.4);
    padding:20px 0;
    margin-bottom:8px;
  }
  .champ-brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .crown-icon{
    width:38px;height:31px;
    color:var(--gold);
    filter:drop-shadow(0 0 6px rgba(212,175,55,0.5));
    flex:0 0 auto;
  }
  .brand-text{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:1.85rem;
    letter-spacing:0.02em;
    color:var(--cream);
    line-height:1.1;
  }
  .brand-text .accent{color:var(--gold-bright);}
  .brand-tagline{
    font-size:12.5px;
    letter-spacing:0.14em;
    color:var(--gold-dim);
    font-weight:600;
    text-transform:uppercase;
    margin-top:3px;
  }
  .user-chip{
    font-size:14.5px;
    color:var(--cream-soft);
    font-weight:600;
    text-align:right;
  }
  .user-chip b{color:var(--gold-bright);}
  .link-btn{
    background:none; border:none; color:var(--gold-dim);
    font-size:13px; font-weight:600; cursor:pointer;
    text-decoration:underline; padding:0;
  }
  .link-btn:hover{color:var(--gold-bright);}

  .champ-subtitle{
    text-align:center;
    color:var(--gold-dim);
    font-size:14px;
    letter-spacing:0.08em;
    font-weight:600;
    text-transform:uppercase;
    margin-bottom:24px;
  }

  .champ-container{max-width:900px;}

  /* ---------- Cards / panels ---------- */
  .champ-card{
    background:var(--charcoal);
    border:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:32px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .champ-card + .champ-card{margin-top:18px;}
  .champ-card-title{
    font-family:'Cinzel', serif;
    font-size:24px;
    color:var(--gold-bright);
    margin:0 0 4px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .title-rule{
    height:3px;
    width:54px;
    background:linear-gradient(90deg, var(--gold), transparent);
    margin:10px 0 18px;
  }
  .champ-hint{
    color:var(--cream-soft);
    font-size:15.5px;
    line-height:1.6;
    max-width:60ch;
    margin-bottom:20px;
  }

  .btn-gold{
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:var(--onyx-deep);
    border:none;
    font-weight:700;
    font-size:15.5px;
    border-radius:var(--radius);
    padding:12px 24px;
    box-shadow:0 2px 10px rgba(212,175,55,0.25);
  }
  .btn-gold:hover{filter:brightness(1.08); color:var(--onyx-deep);}
  .btn-gold:disabled{opacity:0.35;}
  .btn-outline-gold{
    background:transparent;
    color:var(--gold-bright);
    border:1.5px solid var(--gold-dim);
    font-weight:700;
    font-size:15.5px;
    border-radius:var(--radius);
    padding:12px 24px;
  }
  .btn-outline-gold:hover{background:rgba(212,175,55,0.1); color:var(--gold-bright); border-color:var(--gold);}

  .alert-champ-danger{
    background:rgba(192,72,58,0.12);
    color:var(--danger-bright);
    border:1px solid rgba(192,72,58,0.4);
    border-radius:var(--radius);
    padding:12px 16px;
    font-size:15px;
    font-weight:500;
    margin-bottom:18px;
  }
  .alert-champ-warn{
    background:rgba(212,175,55,0.08);
    color:var(--gold-bright);
    border:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:12px 16px;
    font-size:14.5px;
    margin-bottom:18px;
  }
  .alert-champ-info{
    background:var(--charcoal-2);
    border:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:14px 16px;
    font-size:15px;
    color:var(--cream-soft);
  }

  /* ---------- Name gate / loading ---------- */
  .gate-wrap{text-align:center; padding:18px 4px;}
  .gate-crown{width:64px; height:50px; color:var(--gold); margin:0 auto 12px; display:block; filter:drop-shadow(0 0 10px rgba(212,175,55,0.4));}
  .gate-input{
    width:100%; max-width:330px;
    font-family:'Work Sans', sans-serif;
    font-size:17.5px; font-weight:600;
    padding:13px 16px;
    background:var(--onyx);
    color:var(--cream);
    border:1.5px solid var(--gold-line);
    border-radius:var(--radius);
    text-align:center;
    margin:16px auto;
    display:block;
  }
  .gate-input:focus{outline:none; border-color:var(--gold);}
  .gate-input::placeholder{color:var(--cream-soft);}

  /* ---------- Tabs ---------- */
  .champ-tabs{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; justify-content:center;}
  .champ-tab-btn{
    background:var(--charcoal);
    color:var(--cream-soft);
    border:1.5px solid var(--gold-line);
    padding:11px 22px;
    border-radius:100px;
    font-weight:700;
    font-size:14.5px;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .champ-tab-btn.active{background:var(--gold); color:var(--onyx-deep); border-color:var(--gold);}
  .champ-tab-btn:hover:not(.active){border-color:var(--gold);}

  .round-selector{display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; justify-content:center;}
  .round-selector button{
    background:var(--onyx);
    border:1.5px solid var(--gold-line);
    color:var(--cream-soft);
    padding:8px 16px;
    border-radius:100px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .round-selector button.active{background:var(--charcoal-2); border-color:var(--gold); color:var(--gold-bright);}
  .round-selector button.complete{color:var(--gold-bright);}

  .bye-chip{
    background:var(--charcoal-2);
    border:1px dashed var(--gold-dim);
    border-radius:var(--radius);
    padding:12px 16px;
    font-size:15px;
    color:var(--cream-soft);
    font-weight:600;
    margin-bottom:16px;
    text-align:center;
  }
  .bye-chip b{color:var(--gold-bright);}

  /* ---------- Match card ---------- */
  .match-card{
    background:var(--onyx);
    border:1px solid var(--gold-line);
    border-radius:var(--radius);
    padding:19px 21px;
    margin-bottom:16px;
  }
  .mc-head{
    display:grid;
    grid-template-columns:1fr 136px 1fr;
    align-items:center;
    gap:12px;
  }
  .mc-team{
    font-weight:700; font-size:16.5px; color:var(--cream); min-width:0; overflow-wrap:break-word;
    display:flex; flex-direction:row; align-items:center; gap:10px;
  }
  .mc-team.left{justify-content:flex-start;}
  .mc-team.right{justify-content:flex-end;}
  .team-logo{
    border-radius:50%;
    object-fit:cover;
    background:var(--charcoal-2);
    border:1.5px solid var(--gold-dim);
    box-shadow:0 0 6px rgba(212,175,55,0.2);
    flex:0 0 auto;
    vertical-align:middle;
  }
  .mc-score-btn{
    grid-column:2;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:linear-gradient(180deg, var(--charcoal-2), var(--onyx-deep));
    border:1.5px solid var(--gold-dim);
    border-radius:var(--radius);
    padding:10px 8px;
    cursor:pointer;
    width:100%;
  }
  .mc-score-btn:hover{border-color:var(--gold);}
  .mc-score-btn.decided{border-color:var(--gold); box-shadow:0 0 10px rgba(212,175,55,0.25);}
  .mc-score-main{font-family:'Cinzel', serif; font-weight:700; font-size:24px; color:var(--gold-bright); line-height:1;}
  .mc-score-label{font-size:10.5px; color:var(--cream-soft); font-weight:600; letter-spacing:0.03em; text-align:center;}

  .mc-panel{margin-top:16px; padding-top:16px; border-top:1px dashed var(--gold-line);}
  .mc-panel-title{font-size:12.5px; letter-spacing:0.06em; color:var(--gold-dim); font-weight:700; margin-bottom:12px; text-transform:uppercase;}
  .mc-game-row{display:grid; grid-template-columns:74px 1fr auto 1fr; align-items:center; gap:9px; padding:7px 0;}
  .mc-game-idx{font-size:13.5px; color:var(--cream-soft); font-weight:600;}
  .mc-game-row input[type=number]{
    width:100%; max-width:68px; justify-self:center; text-align:center;
    font-family:'Cinzel', serif; font-weight:600; font-size:18px;
    border:1.5px solid var(--gold-line);
    border-radius:4px; padding:6px 3px;
    color:var(--cream);
    background:var(--charcoal-2);
  }
  .mc-game-row input[type=number]:focus{outline:none; border-color:var(--gold);}
  .mc-game-row input[type=number]:disabled{background:var(--onyx-deep); color:var(--cream-soft);}
  .mc-game-row .versus{text-align:center; color:var(--cream-soft); font-weight:600; font-size:13.5px;}
  .mc-panel-footer{margin-top:10px; font-size:14px; color:var(--cream-soft);}
  .mc-panel-footer b{color:var(--gold-bright);}
  .mc-bye-note{text-align:center; color:var(--cream-soft); font-size:14.5px; font-style:italic;}

  /* ---------- Penalty shootout ---------- */
  .pen-box{grid-column:1/-1; margin:8px 0 12px; padding:14px; background:var(--charcoal-2); border:1px solid var(--gold-line); border-radius:7px;}
  .pen-title{font-size:13px; font-weight:700; color:var(--gold-bright); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.04em;}
  .pen-num-row{display:flex; gap:7px; margin:0 0 5px 112px;}
  .pen-num{width:28px; flex:0 0 28px; text-align:center; font-size:11px; color:var(--cream-soft);}
  .pen-team-row{display:flex; align-items:center; gap:9px; margin-bottom:7px;}
  .pen-team-label{width:104px; flex:0 0 104px; font-size:13.5px; font-weight:600; color:var(--cream); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pen-dots{display:flex; gap:7px; flex-wrap:wrap;}
  .pen-dot{
    width:28px;height:28px;flex:0 0 28px; border-radius:50%;
    border:2px solid var(--gold-dim); background:var(--onyx); cursor:pointer; padding:0;
  }
  .pen-dot:hover{border-color:var(--gold);}
  .pen-dot.pen-made{background:var(--gold); border-color:var(--gold-bright);}
  .pen-dot.pen-miss{background:var(--danger); border-color:var(--danger-bright);}
  .pen-dot:disabled{cursor:not-allowed; opacity:0.85;}
  .pen-summary{font-size:14px; color:var(--cream-soft); margin-top:9px;}
  .pen-summary b{color:var(--gold-bright);}

  /* ---------- Standings table (primary view — extra emphasis) ---------- */
  table.standings{width:100%; border-collapse:collapse; font-size:16.5px;}
  table.standings th{
    text-align:center; font-size:12.5px; letter-spacing:0.06em; color:var(--gold-dim);
    padding:11px 8px; border-bottom:2px solid var(--gold); font-weight:700; text-transform:uppercase;
  }
  table.standings th.team-col, table.standings td.team-col{text-align:left;}
  table.standings td{text-align:center; padding:14px 8px; border-bottom:1px solid var(--gold-line); color:var(--cream);}
  table.standings tr:last-child td{border-bottom:none;}
  table.standings td.team-col{font-weight:700; display:flex; align-items:center; gap:12px;}
  table.standings td.pts{font-family:'Cinzel', serif; font-weight:700; font-size:19px; color:var(--gold-bright);}
  .pos-badge{
    width:26px;height:26px;flex:0 0 26px; border-radius:50%;
    background:var(--charcoal-2); color:var(--cream-soft);
    display:flex;align-items:center;justify-content:center; font-size:12.5px; font-weight:700;
  }
  .pos-badge.advance{background:var(--gold); color:var(--onyx-deep);}

  /* ---------- Knockout config ---------- */
  .config-row{display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .stepper{display:flex; align-items:center; border:1.5px solid var(--gold-line); border-radius:var(--radius); overflow:hidden;}
  .stepper button{background:var(--charcoal-2); border:none; width:40px;height:40px; font-size:19px; cursor:pointer; color:var(--gold-bright);}
  .stepper button:hover{background:var(--gold); color:var(--onyx-deep);}
  .stepper .val{width:56px; text-align:center; font-family:'Cinzel',serif; font-weight:700; font-size:21px; color:var(--cream);}
  .advance-note{background:rgba(212,175,55,0.1); border:1px solid var(--gold-line); border-radius:var(--radius); padding:14px 16px; font-size:15.5px; color:var(--cream-soft);}
  .advance-note b{color:var(--gold-bright);}
  .roster-preview{list-style:none; padding:0; margin:0 0 18px; display:flex; flex-direction:column; gap:8px;}
  .roster-preview li{display:flex; align-items:center; gap:12px; font-weight:600; font-size:16px; color:var(--cream);}

  .ko-round-label{
    font-family:'Cinzel', serif;
    font-size:16px; letter-spacing:0.08em; color:var(--gold-bright); font-weight:700;
    margin-bottom:16px; text-align:center; text-transform:uppercase;
  }

  /* ---------- Champion ---------- */
  .champion-card{text-align:center; padding:52px 22px; position:relative; overflow:hidden;}
  .champion-glow{
    position:absolute; top:-40%; left:50%; transform:translateX(-50%);
    width:380px; height:380px; border-radius:50%;
    background:radial-gradient(circle, rgba(212,175,55,0.35), transparent 65%);
    pointer-events:none;
  }
  .champion-crown{width:72px; height:56px; color:var(--gold); margin:0 auto 12px; display:block; filter:drop-shadow(0 0 14px rgba(212,175,55,0.6)); position:relative;}
  .champion-name{font-family:'Cinzel', serif; font-weight:800; font-size:39px; color:var(--gold-bright); margin:6px 0 8px; position:relative;}
  .champion-sub{color:var(--cream-soft); font-size:16px; position:relative;}

  ::placeholder{color:var(--cream-soft);}

  /* ---------- Simulation mode ---------- */
  .sim-toggle{
    position:fixed;
    right:16px;
    bottom:16px;
    z-index:40;
  }
  .sim-toggle-btn{
    background:var(--charcoal);
    color:var(--gold-bright);
    border:1.5px solid var(--gold-dim);
    padding:9px 16px;
    border-radius:100px;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.5);
  }
  .sim-toggle-btn:hover{border-color:var(--gold); background:var(--charcoal-2);}
  .sim-toggle-btn.on{background:var(--teal); color:var(--onyx-deep); border-color:var(--teal);}
  .sim-banner{
    background:rgba(63,112,140,0.16);
    border:1px solid var(--teal);
    color:var(--cream);
    border-radius:var(--radius);
    padding:12px 16px;
    font-size:14px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
  }
  .sim-banner b{color:var(--gold-bright);}
  .sim-banner-actions{display:flex; gap:14px; flex-wrap:wrap;}

  @media (max-width:520px){
    .mc-head{grid-template-columns:1fr; text-align:center; gap:12px;}
    .mc-team.left, .mc-team.right{justify-content:center;}
    .mc-score-btn{grid-column:1; max-width:200px; margin:0 auto;}
    .mc-game-row{grid-template-columns:64px 1fr auto 1fr;}
    .pen-num-row{margin-left:0; justify-content:center;}
    .pen-team-row{flex-wrap:wrap; justify-content:center;}
    .pen-dots{justify-content:center;}
    .champ-navbar .container-fluid{flex-direction:column; gap:12px; text-align:center;}
    .brand-text{font-size:1.45rem;}
    .champ-card{padding:22px;}
  }
</style>
</head>
<body>

<nav class="champ-navbar">
  <div class="container-fluid champ-container d-flex align-items-center justify-content-between">
    <div class="champ-brand">
      <svg class="crown-icon" viewBox="0 0 64 48" xmlns="http://www.w3.org/2000/svg"><path d="M4 40 L4 18 L17 29 L32 8 L47 29 L60 18 L60 40 Z" fill="currentColor"/><rect x="4" y="40" width="56" height="6" rx="1.5" fill="currentColor"/><circle cx="17" cy="23" r="3" fill="currentColor"/><circle cx="32" cy="13" r="3.6" fill="currentColor"/><circle cx="47" cy="23" r="3" fill="currentColor"/></svg>
      <div>
        <div class="brand-text">CAMPEONATO <span class="accent">TIETÊ &amp; CERQUILHO</span></div>
        <div class="brand-tagline">Temporada oficial</div>
      </div>
    </div>
    <div id="userBox"></div>
  </div>
</nav>
<div class="champ-subtitle" id="subtitle">Carregando...</div>

<div class="container champ-container" id="app"></div>

<div id="simToggle" class="sim-toggle"></div>

<script>
(function(){

  const STORAGE_KEY = 'campeonato-principal-state';

  function teamById(id){ return data.teams.find(t => t.id === id); }

  function makeGames(){
    return [0,1,2,3,4].map(() => ({ h:null, a:null, penalties:null }));
  }

  function makeDefaultData(){
    return {
      teams: TEAM_DEFS.map(t => ({ ...t })),
      rounds: ROUND_DEFS.map(rd => ({
        byeTeamId: rd.byeTeamId,
        matches: rd.pairs.map(([h,a]) => ({ homeId:h, awayId:a, games: makeGames(), winnerId:null, isBye:false, expanded:false }))
      })),
      knockout: null
    };
  }

  function hydrate(d){
    d.rounds.forEach(r => r.matches.forEach(m => { m.expanded = false; }));
    if (d.knockout && d.knockout.rounds){
      d.knockout.rounds.forEach(rd => rd.forEach(m => { m.expanded = false; }));
    }
    return d;
  }

  function stripForStorage(d){
    const clone = JSON.parse(JSON.stringify(d));
    clone.rounds.forEach(r => r.matches.forEach(m => { delete m.expanded; }));
    if (clone.knockout && clone.knockout.rounds){
      clone.knockout.rounds.forEach(rd => rd.forEach(m => { delete m.expanded; }));
    }
    return clone;
  }

  async function trySave(){
    if (!storageAvailable || simMode) return;
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(stripForStorage(officialData)), true);
      saveError = null;
    }catch(e){
      saveError = 'Não foi possível salvar agora. Tente novamente em instantes.';
    }
  }

  async function boot(){
    storageAvailable = !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function');
    view = 'loading';
    render();
    if (storageAvailable){
      try{
        const res = await window.storage.get(STORAGE_KEY, true);
        if (res && res.value){
          officialData = hydrate(JSON.parse(res.value));
        } else {
          officialData = makeDefaultData();
          data = officialData;
          await trySave();
        }
      }catch(e){
        officialData = makeDefaultData();
        data = officialData;

  function startPolling(){

  // ---------- Penalty shootout logic ----------
  function ensurePenaltyRounds(game, minLen){
    if (!game.penalties) game.penalties = { rounds: [] };
    while (game.penalties.rounds.length < minLen) game.penalties.rounds.push({ home:null, away:null });
  }

  function computeShootout(rounds){
    let homeMakes = 0, awayMakes = 0, homeTaken = 0, awayTaken = 0;
    let decided = false, winnerSide = null, decidedAtRound = -1;
    for (let i = 0; i < rounds.length && !decided; i++){
      const rd = rounds[i];
      if (i < 5){
        if (rd.home !== null){
          homeTaken++; if (rd.home === 'green') homeMakes++;
          if (homeMakes > awayMakes + (5 - awayTaken)){ decided = true; winnerSide = 'home'; decidedAtRound = i; break; }
          if (awayMakes > homeMakes + (5 - homeTaken)){ decided = true; winnerSide = 'away'; decidedAtRound = i; break; }
        }
        if (rd.away !== null){
          awayTaken++; if (rd.away === 'green') awayMakes++;
          if (homeMakes > awayMakes + (5 - awayTaken)){ decided = true; winnerSide = 'home'; decidedAtRound = i; break; }
          if (awayMakes > homeMakes + (5 - homeTaken)){ decided = true; winnerSide = 'away'; decidedAtRound = i; break; }
        }
        if (rd.home === null || rd.away === null) break;
      } else {
        if (rd.home === null || rd.away === null) break;
        const hGreen = rd.home === 'green', aGreen = rd.away === 'green';
        if (hGreen && !aGreen){ decided = true; winnerSide = 'home'; decidedAtRound = i; break; }
        if (aGreen && !hGreen){ decided = true; winnerSide = 'away'; decidedAtRound = i; break; }
      }
    }
    return { homeMakes, awayMakes, decided, winnerSide, decidedAtRound };
  }

  function visiblePenaltyRounds(rounds){
    const s = computeShootout(rounds);
    if (s.decided) return s.decidedAtRound + 1;
    let filled = 0;
    for (let i = 0; i < rounds.length; i++){
      const r = rounds[i];
      if (r && r.home !== null && r.away !== null) filled = i + 1;
      else break;
    }
    return filled + 1;
  }

  // ---------- MD5 leg + series logic ----------
  function legIsFilled(g){
    if (!g || g.h === null || g.a === null || g.h === '' || g.a === '') return false;
    if (Number(g.h) === Number(g.a)){
      if (!g.penalties) return false;
      return computeShootout(g.penalties.rounds).decided;
    }
    return true;
  }

  function legWinnerSide(g){
    const h = Number(g.h), a = Number(g.a);
    if (h !== a) return h > a ? 'home' : 'away';
    return computeShootout(g.penalties.rounds).winnerSide;
  }

  function computeSeries(games){
    let hw = 0, aw = 0, decidedAt = -1;
    for (let i = 0; i < 5; i++){
      const g = games[i];
      if (!legIsFilled(g)) break;
      const side = legWinnerSide(g);
      if (side === 'home') hw++; else aw++;
      if (hw === 3 || aw === 3){ decidedAt = i; break; }
    }
    return {
      homeWins: hw, awayWins: aw,
      decided: decidedAt !== -1,
      winnerSide: decidedAt !== -1 ? (hw === 3 ? 'home' : 'away') : null,
      decidedAt
    };
  }

  function visibleRowCount(games){
    const s = computeSeries(games);
    if (s.decided) return s.decidedAt + 1;
    let filled = 0;
    for (let i = 0; i < 5; i++){
      if (legIsFilled(games[i])) filled = i + 1;
      else break;
    }
    return Math.min(filled + 1, 5);
  }

  function seriesGoalTotals(games, upTo){
    let gp = 0, gc = 0;
    for (let i = 0; i <= upTo; i++){
      const g = games[i];
      if (g && g.h !== null && g.a !== null && g.h !== '' && g.a !== ''){
        gp += Number(g.h); gc += Number(g.a);
      }
    }
    return { gp, gc };
  }

  function computeStandings(){
    const statsMap = {};
    data.teams.forEach(t => { statsMap[t.id] = { J:0, V:0, D:0, GP:0, GC:0, SG:0, Pts:0 }; });
    data.rounds.forEach(round => {
      round.matches.forEach(m => {
        const s = computeSeries(m.games);
        if (!s.decided) return;
        const winnerId = s.winnerSide === 'home' ? m.homeId : m.awayId;
        const loserId = s.winnerSide === 'home' ? m.awayId : m.homeId;
        const { gp, gc } = seriesGoalTotals(m.games, s.decidedAt);
        const winnerGoals = s.winnerSide === 'home' ? gp : gc;
        const loserGoals = s.winnerSide === 'home' ? gc : gp;
        statsMap[winnerId].J++; statsMap[loserId].J++;
        statsMap[winnerId].V++; statsMap[winnerId].Pts += 3;
        statsMap[loserId].D++;
        statsMap[winnerId].GP += winnerGoals; statsMap[winnerId].GC += loserGoals;
        statsMap[loserId].GP += loserGoals; statsMap[loserId].GC += winnerGoals;
        statsMap[winnerId].SG = statsMap[winnerId].GP - statsMap[winnerId].GC;
        statsMap[loserId].SG = statsMap[loserId].GP - statsMap[loserId].GC;
      });
    });
    return data.teams.map(t => ({ team:t, s: statsMap[t.id] })).sort((a,b) => {
      if (b.s.Pts !== a.s.Pts) return b.s.Pts - a.s.Pts;
      if (b.s.SG !== a.s.SG) return b.s.SG - a.s.SG;
      if (b.s.GP !== a.s.GP) return b.s.GP - a.s.GP;
      if (b.s.V !== a.s.V) return b.s.V - a.s.V;
      return a.team.name.localeCompare(b.team.name, 'pt-BR');
    });
  }

  function groupStageComplete(){
    return data.rounds.every(r => r.matches.every(m => computeSeries(m.games).decided));
  }

  function firstIncompleteRoundIndex(){
    for (let i = 0; i < data.rounds.length; i++){
      if (!data.rounds[i].matches.every(m => computeSeries(m.games).decided)) return i;
    }
    return data.rounds.length - 1;
  }

  // ---------- Simulation mode (free-play sandbox, never touches saved data) ----------
  function cloneForSim(source){

  function nextPowerOfTwo(k){
    let p = 1;
    while (p < k) p *= 2;
    return p;
  }

  function seedOrder(n){
    let seeds = [1,2];
    let rounds = Math.log2(n);
    for (let i = 1; i < rounds; i++){
      const s = Math.pow(2, i+1);
      const next = [];
      seeds.forEach(v => { next.push(v); next.push(s+1-v); });
      seeds = next;
    }
    return seeds;
  }

  function buildKnockoutFirstRound(advancingCount){
    const ranked = computeStandings().slice(0, advancingCount).map(r => r.team);
    const size = nextPowerOfTwo(advancingCount);
    const order = seedOrder(size);
    const seedToTeam = (seed) => seed <= advancingCount ? ranked[seed-1] : null;
    let matches = [];
    for (let i = 0; i < order.length; i += 2){
      const home = seedToTeam(order[i]);
      const away = seedToTeam(order[i+1]);
      let match = { homeId: home ? home.id : null, awayId: away ? away.id : null,
        games: makeGames(), winnerId:null, isBye:false, expanded:false };
      if (!home || !away){
        match.isBye = true;
        match.winnerId = home ? home.id : away.id;
      }
      matches.push(match);
    }
    return matches;
  }

  function buildNextKnockoutRound(prevMatches){
    const winners = prevMatches.map(m => m.winnerId);
    let matches = [];
    for (let i = 0; i < winners.length; i += 2){
      const isBye = !winners[i+1];
      matches.push({ homeId: winners[i], awayId: winners[i+1] || null,
        games: makeGames(), winnerId: isBye ? winners[i] : null, isBye, expanded:false });
    }
    return matches;
  }

  function roundLabel(numMatchesInRound){
    const teamsIn = numMatchesInRound * 2;
    if (teamsIn <= 2) return 'FINAL';
    if (teamsIn === 4) return 'SEMIFINAL';
    if (teamsIn === 8) return 'QUARTAS DE FINAL';
    if (teamsIn === 16) return 'OITAVAS DE FINAL';
    return teamsIn + 'ª DE FINAL';
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function teamLogoImg(team, size){
    if (!team || !team.logo) return '';
    return `<img src="${team.logo}" alt="${escapeHtml(team.name)}" class="team-logo" style="width:${size}px; height:${size}px;">`;
  }

  // ---------- Shared rendering: penalty shootout box ----------
  function renderPenaltyBoxHtml(game, gi, homeName, awayName, readOnly){
    ensurePenaltyRounds(game, 5);
    const visible = Math.max(5, visiblePenaltyRounds(game.penalties.rounds));
    ensurePenaltyRounds(game, visible);
    const s = computeShootout(game.penalties.rounds);

    const numRow = game.penalties.rounds.slice(0, visible).map((_, i) => `<div class="pen-num">${i+1}</div>`).join('');
    const dotCls = (v) => v === 'green' ? 'pen-made' : (v === 'red' ? 'pen-miss' : '');
    const dis = readOnly ? 'disabled' : '';
    const homeDots = game.penalties.rounds.slice(0, visible).map((rd,i) => `<button type="button" ${dis} class="pen-dot ${dotCls(rd.home)}" data-gi="${gi}" data-ri="${i}" data-side="home"></button>`).join('');
    const awayDots = game.penalties.rounds.slice(0, visible).map((rd,i) => `<button type="button" ${dis} class="pen-dot ${dotCls(rd.away)}" data-gi="${gi}" data-ri="${i}" data-side="away"></button>`).join('');

    let summary = `Pênaltis: <b>${s.homeMakes}-${s.awayMakes}</b>`;
    if (s.decided){
      const winnerName = s.winnerSide === 'home' ? homeName : awayName;
      summary += ` — vencedor nos pênaltis: <b>${escapeHtml(winnerName)}</b>`;
    } else if (visible > 5) {
      summary += ' — disputa alternada até decidir';
    }

    return `
      <div class="pen-box">
        <div class="pen-title">Empate! Decida nos pênaltis</div>
        <div class="pen-num-row">${numRow}</div>
        <div class="pen-team-row">
          <div class="pen-team-label">${escapeHtml(homeName)}</div>
          <div class="pen-dots">${homeDots}</div>
        </div>
        <div class="pen-team-row">
          <div class="pen-team-label">${escapeHtml(awayName)}</div>
          <div class="pen-dots">${awayDots}</div>
        </div>
        <div class="pen-summary">${summary}</div>
      </div>
    `;
  }

  // ---------- Shared match card rendering (group stage + knockout) ----------
  function renderMatchCardHtml(match, idx, readOnly){
    if (match.isBye){
      const winner = teamById(match.winnerId);
      return `
        <div class="match-card">
          <div class="mc-head">
            <div class="mc-team left">${teamLogoImg(winner, 46)}${escapeHtml(winner.name)}</div>
            <div></div>
            <div></div>
          </div>
          <div class="mc-bye-note">Avança direto por folga na chave</div>
        </div>
      `;
    }
    const home = teamById(match.homeId), away = teamById(match.awayId);
    const series = computeSeries(match.games);
    const scoreText = (series.homeWins === 0 && series.awayWins === 0) ? 'vs' : (series.homeWins + '-' + series.awayWins);
    let label = readOnly ? 'TOQUE PARA VER O MD5' : 'TOQUE PARA JOGAR O MD5';
    if (series.decided) label = 'MD5 ENCERRADO';
    else if (series.homeWins + series.awayWins > 0) label = 'MD5 EM ANDAMENTO';

    const visibleRows = visibleRowCount(match.games);
    const dis = readOnly ? 'disabled' : '';
    let rowsHtml = '';
    for (let i = 0; i < visibleRows; i++){
      const g = match.games[i];
      const hVal = g.h === null ? '' : g.h;
      const aVal = g.a === null ? '' : g.a;
      const isTie = g.h !== null && g.a !== null && g.h !== '' && g.a !== '' && Number(g.h) === Number(g.a);
      rowsHtml += `
        <div class="mc-game-row">
          <div class="mc-game-idx">Jogo ${i+1}</div>
          <input type="number" min="0" ${dis} class="mc-g-home" data-gi="${i}" value="${hVal}">
          <div class="versus">×</div>
          <input type="number" min="0" ${dis} class="mc-g-away" data-gi="${i}" value="${aVal}">
        </div>
        ${isTie ? renderPenaltyBoxHtml(g, i, home.name, away.name, readOnly) : ''}
      `;
    }
    let footer = '';
    if (series.decided){
      const winnerTeam = series.winnerSide === 'home' ? home : away;
      footer = `<div class="mc-panel-footer">Série encerrada: <b>${escapeHtml(winnerTeam.name)}</b> venceu por ${series.homeWins}-${series.awayWins}, sem precisar dos jogos restantes.</div>`;
    } else {
      footer = `<div class="mc-panel-footer">Quem fizer 3 vitórias primeiro leva o confronto (melhor de 5). Empate no placar vai para os pênaltis.</div>`;
    }

    return `
      <div class="match-card" data-midx="${idx}">
        <div class="mc-head">
          <div class="mc-team left">${teamLogoImg(home, 46)}${escapeHtml(home.name)}</div>
          <button class="mc-score-btn ${series.decided ? 'decided' : ''}" data-toggle="${idx}">
            <span class="mc-score-main">${scoreText}</span>
            <span class="mc-score-label">${label}</span>
          </button>
          <div class="mc-team right">${teamLogoImg(away, 46)}${escapeHtml(away.name)}</div>
        </div>
        <div class="mc-panel" data-panel="${idx}" style="display:${match.expanded ? 'block' : 'none'}">
          <div class="mc-panel-title">Melhor de 5 — ${escapeHtml(home.name)} × ${escapeHtml(away.name)}</div>
          ${rowsHtml}
          ${footer}
        </div>
      </div>
    `;
  }

  function bindMatchCardHandlers(container, matches, onChange, readOnly){
    container.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.toggle);
        matches[idx].expanded = !matches[idx].expanded;
        onChange();
      });
    });
    if (readOnly) return;
    container.querySelectorAll('.match-card').forEach(card => {
      const idx = Number(card.dataset.midx);
      if (Number.isNaN(idx)) return;
      const match = matches[idx];
      card.querySelectorAll('.mc-g-home, .mc-g-away').forEach(inp => {
        inp.addEventListener('input', () => {
          const gi = Number(inp.dataset.gi);
          const homeInp = card.querySelector('.mc-g-home[data-gi="'+gi+'"]');
          const awayInp = card.querySelector('.mc-g-away[data-gi="'+gi+'"]');
          match.games[gi].h = homeInp.value === '' ? null : Number(homeInp.value);
          match.games[gi].a = awayInp.value === '' ? null : Number(awayInp.value);
          onChange();
          trySave();
        });
      });
      card.querySelectorAll('.pen-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          const gi = Number(dot.dataset.gi);
          const ri = Number(dot.dataset.ri);
          const side = dot.dataset.side;
          const g = match.games[gi];
          ensurePenaltyRounds(g, ri+1);
          const current = g.penalties.rounds[ri][side];
          const next = current === null ? 'green' : (current === 'green' ? 'red' : null);
          g.penalties.rounds[ri][side] = next;
          onChange();
          trySave();
        });
      });
    });
  }

  // ---------- Render ----------
  function render(){
    renderSimToggle();
    if (view === 'loading') renderLoading();
    else if (view === 'name-gate') renderNameGate();
    else if (view === 'app') renderAppShell();
  }

  function renderLoading(){
    subtitle.textContent = 'Carregando o campeonato';
    userBox.innerHTML = '';
    app.innerHTML = `
      <div class="champ-card gate-wrap">
        <h2 class="champ-card-title justify-content-center">Carregando</h2>
        <div class="title-rule mx-auto"></div>
        <p class="champ-hint mx-auto text-center">Buscando o estado atual do campeonato...</p>
        <div class="spinner-border" style="color:var(--gold);" role="status"></div>
      </div>
    `;
  }

  function renderNameGate(){
    subtitle.textContent = 'Identifique-se para continuar';
    userBox.innerHTML = '';
    const canCancel = true;
    app.innerHTML = `
      <div class="champ-card gate-wrap">
        ${CROWN_SVG.replace('crown-icon','gate-crown')}
        <h2 class="champ-card-title justify-content-center">Quem está acessando?</h2>
        <div class="title-rule mx-auto"></div>
        <p class="champ-hint mx-auto text-center">Digite seu nome para acompanhar o campeonato. Apenas o administrador do torneio pode editar os placares.</p>
        <input type="text" id="nameInput" class="gate-input" placeholder="Seu nome" maxlength="40" autocomplete="off">
        <div class="d-flex justify-content-center gap-2 mt-2">
          <button class="btn-gold" id="enterBtn">Entrar</button>
          ${canCancel ? '<button class="btn-outline-gold" id="cancelGateBtn">Voltar</button>' : ''}
        </div>
        ${!storageAvailable ? '<div class="alert-champ-warn mt-4 text-start">Este arquivo está sendo aberto fora do ambiente da Claude, então o armazenamento persistente não está disponível aqui: as alterações não serão salvas entre sessões nem compartilhadas com outras pessoas.</div>' : ''}
      </div>
    `;
    const input = document.getElementById('nameInput');
    const enter = () => {
      const val = input.value.trim();
      if (!val) { input.focus(); return; }
      currentUser = val;
      isAdmin = val.toUpperCase() === ADMIN_NAME;
      view = 'app';
      render();
    };
    document.getElementById('enterBtn').addEventListener('click', enter);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') enter(); });
    const cancelBtn = document.getElementById('cancelGateBtn');
    if (cancelBtn) cancelBtn.addEventListener('click', () => { view = 'app'; render(); });
    input.focus();
  }

  function renderUserBox(){
    if (!currentUser){
      userBox.innerHTML = `<button class="link-btn" id="loginBtn">Login</button>`;
      document.getElementById('loginBtn').addEventListener('click', () => { view = 'name-gate'; render(); });
      return;
    }
    userBox.innerHTML = `
      <div class="text-end">
        <div class="user-chip">${escapeHtml(currentUser)} · <b>${isAdmin ? 'Administrador' : 'Visitante'}</b></div>
        <button class="link-btn" id="switchUserBtn">Trocar de usuário</button>
      </div>
    `;
    document.getElementById('switchUserBtn').addEventListener('click', () => {
      currentUser = null; isAdmin = false; view = 'app'; render();
    });
  }

  function renderAppShell(){
    subtitle.textContent = simMode ? 'Modo simulação — edição livre para qualquer pessoa' : (isAdmin ? 'Modo de edição liberado' : 'Acompanhando o campeonato');
    renderUserBox();

    const simBanner = simMode ? `
      <div class="sim-banner">
        <div>Você está na <b>Simulação</b>: pode editar qualquer rodada e o mata-mata à vontade. Nada aqui é salvo no campeonato oficial.</div>
        <div class="sim-banner-actions">
          <button class="link-btn" id="simResetBtn">Reiniciar simulação</button>
          <button class="link-btn" id="simExitBtn2">Sair da simulação</button>
        </div>
      </div>
    ` : '';

    const tabsHtml = `
      <div class="champ-tabs">
        <button class="champ-tab-btn ${activeTab==='rounds'?'active':''}" data-tab="rounds">Rodadas</button>
        <button class="champ-tab-btn ${activeTab==='standings'?'active':''}" data-tab="standings">Classificação</button>
        <button class="champ-tab-btn ${activeTab==='knockout'?'active':''}" data-tab="knockout">Mata-mata</button>
      </div>
    `;

    let body = '';
    if (activeTab === 'rounds') body = renderRoundsTabHtml();
    else if (activeTab === 'standings') body = renderStandingsTabHtml();
    else body = renderKnockoutTabHtml();

    app.innerHTML = simBanner + tabsHtml + body;

    const simResetBtn = document.getElementById('simResetBtn');
    if (simResetBtn) simResetBtn.addEventListener('click', () => enterSimMode(true));
    const simExitBtn2 = document.getElementById('simExitBtn2');
    if (simExitBtn2) simExitBtn2.addEventListener('click', exitSimMode);

    app.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.dataset.tab; render(); });
    });

    if (activeTab === 'rounds') bindRoundsTab();
    else if (activeTab === 'knockout') bindKnockoutTab();
  }

  // ---------- Rodadas tab ----------
  function renderRoundsTabHtml(){
    const selectorHtml = data.rounds.map((r, i) => {
      const done = r.matches.every(m => computeSeries(m.games).decided);
      let classes = done ? 'complete' : '';
      if (i === selectedRoundIndex) classes += ' active';
      return `<button class="${classes}" data-round="${i}">Rodada ${i+1}${done ? ' \u2713' : ''}</button>`;
    }).join('');

    const round = data.rounds[selectedRoundIndex];
    const byeTeam = teamById(round.byeTeamId);
    const byeHtml = `<div class="bye-chip">Folga nesta rodada: ${teamLogoImg(byeTeam, 28)} <b>${escapeHtml(byeTeam.name)}</b></div>`;
    const readOnly = !canEdit();
    const matchesHtml = round.matches.map((m, idx) => renderMatchCardHtml(m, idx, readOnly)).join('');

    return `
      <div class="champ-card">
        <div class="round-selector">${selectorHtml}</div>
        <h2 class="champ-card-title">Rodada ${selectedRoundIndex+1}</h2>
        <div class="title-rule"></div>
        <p class="champ-hint">${readOnly ? 'Acompanhe os confrontos desta rodada. Toque no placar para ver o detalhe do melhor de 5.' : 'Toque no placar de cada confronto para abrir o melhor de 5 e lançar os resultados jogo a jogo. Empate em um jogo abre os pênaltis.'}</p>
        ${saveError ? '<div class="alert-champ-danger">'+saveError+'</div>' : ''}
        ${byeHtml}
        ${matchesHtml}
      </div>
    `;
  }

  function bindRoundsTab(){
    app.querySelectorAll('[data-round]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedRoundIndex = Number(btn.dataset.round);
        render();
      });
    });
    const round = data.rounds[selectedRoundIndex];
    bindMatchCardHandlers(app, round.matches, renderAppShell, !canEdit());
  }

  // ---------- Classificação tab ----------
  function renderStandingsTabHtml(){
    const ranked = computeStandings();
    const rows = ranked.map((r, i) => `
      <tr>
        <td><div class="pos-badge">${i+1}</div></td>
        <td class="team-col">${teamLogoImg(r.team, 34)}${escapeHtml(r.team.name)}</td>
        <td class="pts">${r.s.Pts}</td>
        <td>${r.s.J}</td>
        <td>${r.s.V}</td>
        <td>${r.s.D}</td>
        <td>${r.s.SG > 0 ? '+' + r.s.SG : r.s.SG}</td>
      </tr>
    `).join('');

    const complete = groupStageComplete();
    const pendingCount = data.rounds.reduce((acc, r) => acc + r.matches.filter(m => !computeSeries(m.games).decided).length, 0);

    return `
      <div class="champ-card">
        <h2 class="champ-card-title">Classificação</h2>
        <div class="title-rule"></div>
        <p class="champ-hint">Time, pontos, jogos, vitórias, derrotas e saldo de gols, na ordem oficial de desempate. Como cada confronto é um melhor de 5 (com pênaltis se precisar), não há empates na fase de grupos.</p>
        <table class="standings">
          <thead>
            <tr>
              <th></th>
              <th class="team-col">Time</th>
              <th>Pts</th>
              <th>J</th>
              <th>V</th>
              <th>D</th>
              <th>SG</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="alert-champ-info mt-4">
          ${complete ? 'Fase de grupos concluída. Vá até a aba Mata-mata para seguir com o torneio.' : `Faltam ${pendingCount} confronto${pendingCount===1?'':'s'} para concluir a fase de grupos.`}
        </div>
      </div>
    `;
  }

  // ---------- Mata-mata tab ----------
  function renderKnockoutTabHtml(){
    const readOnly = !canEdit();
    if (!groupStageComplete()){
      return `
        <div class="champ-card">
          <h2 class="champ-card-title">Mata-mata</h2>
          <div class="title-rule"></div>
          <p class="champ-hint">O mata-mata é liberado assim que todos os confrontos da fase de grupos forem decididos.</p>
          <div class="alert-champ-info">A fase de grupos ainda está em andamento.</div>
        </div>
      `;
    }
    if (!data.knockout){
      if (readOnly){
        return `
          <div class="champ-card">
            <h2 class="champ-card-title">Mata-mata</h2>
            <div class="title-rule"></div>
            <p class="champ-hint">A fase de grupos terminou. O administrador ainda não configurou o mata-mata.</p>
          </div>
        `;
      }
      if (typeof renderKnockoutTabHtml.eliminated !== 'number') renderKnockoutTabHtml.eliminated = 0;
      const maxEliminated = data.teams.length - 1;
      const eliminated = Math.min(renderKnockoutTabHtml.eliminated, maxEliminated);
      const advancing = data.teams.length - eliminated;
      const ranked = computeStandings();
      const previewHtml = ranked.slice(0, advancing).map((r,i) => `
        <li><div class="pos-badge advance">${i+1}</div> ${teamLogoImg(r.team, 28)} ${escapeHtml(r.team.name)}</li>
      `).join('');
      return `
        <div class="champ-card">
          <h2 class="champ-card-title">Configurar o mata-mata</h2>
          <div class="title-rule"></div>
          <p class="champ-hint">Escolha quantos times ficam pelo caminho. Os melhores colocados avançam, também disputando no melhor de 5 com pênaltis.</p>
          <div class="config-row">
            <div class="stepper">
              <button id="stepDown">−</button>
              <div class="val" id="stepVal">${eliminated}</div>
              <button id="stepUp">+</button>
            </div>
            <div class="advance-note"><b>${advancing}</b> ${advancing === 1 ? 'time avança' : 'times avançam'} ao mata-mata</div>
          </div>
          <ul class="roster-preview">${previewHtml}</ul>
          <div class="d-flex">
            <button class="btn-gold" id="genKoBtn" ${advancing < 1 ? 'disabled' : ''}>Gerar mata-mata</button>
          </div>
        </div>
      `;
    }
    if (data.knockout.champion){
      const champ = teamById(data.knockout.champion);
      return `
        <div class="champ-card champion-card">
          <div class="champion-glow"></div>
          ${CROWN_SVG.replace('crown-icon','champion-crown')}
          <div class="d-flex justify-content-center" style="position:relative; margin-top:6px;">${teamLogoImg(champ, 112)}</div>
          <div class="champion-name">${escapeHtml(champ.name)}</div>
          <div class="champion-sub">é o campeão do Campeonato Tietê & Cerquilho</div>
        </div>
      `;
    }
    const round = data.knockout.rounds[data.knockout.currentRoundIndex];
    const matchesHtml = round.map((m, idx) => renderMatchCardHtml(m, idx, readOnly)).join('');
    return `
      <div class="champ-card">
        <div class="ko-round-label">${roundLabel(round.length)}</div>
        ${saveError ? '<div class="alert-champ-danger">'+saveError+'</div>' : ''}
        ${matchesHtml}
        ${!readOnly ? `
          <div id="koError"></div>
          <div class="d-flex">
            <button class="btn-gold" id="confirmKoBtn">Confirmar rodada do mata-mata</button>
          </div>
        ` : ''}
      </div>
    `;
  }

  function bindKnockoutTab(){
    if (!groupStageComplete()) return;
    if (!data.knockout){
      if (!canEdit()) return;
      const maxEliminated = data.teams.length - 1;
      const stepDown = document.getElementById('stepDown');
      const stepUp = document.getElementById('stepUp');
      if (stepDown) stepDown.addEventListener('click', () => {
        renderKnockoutTabHtml.eliminated = Math.max(0, (renderKnockoutTabHtml.eliminated||0) - 1);
        render();
      });
      if (stepUp) stepUp.addEventListener('click', () => {
        renderKnockoutTabHtml.eliminated = Math.min(maxEliminated, (renderKnockoutTabHtml.eliminated||0) + 1);
        render();
      });
      const genBtn = document.getElementById('genKoBtn');
      if (genBtn) genBtn.addEventListener('click', async () => {
        const eliminated = Math.min(renderKnockoutTabHtml.eliminated||0, maxEliminated);
        const advancing = data.teams.length - eliminated;
        if (advancing < 1) return;
        const ranked = computeStandings();
        if (advancing === 1){
          data.knockout = { champion: ranked[0].team.id, rounds: [], currentRoundIndex:0, advancing:1 };
        } else {
          const firstRound = buildKnockoutFirstRound(advancing);
          data.knockout = { advancing, rounds: [firstRound], currentRoundIndex: 0, champion: null };
        }
        render();
        await trySave();
      });
      return;
    }
    if (data.knockout.champion) return;
    const round = data.knockout.rounds[data.knockout.currentRoundIndex];
    bindMatchCardHandlers(app, round, renderAppShell, !canEdit());
    if (!canEdit()) return;
    const confirmBtn = document.getElementById('confirmKoBtn');
    if (confirmBtn) confirmBtn.addEventListener('click', async () => {
      let ok = true;
      round.forEach(m => {
        if (m.isBye) return;
        const s = computeSeries(m.games);
        if (!s.decided) ok = false;
        else m.winnerId = s.winnerSide === 'home' ? m.homeId : m.awayId;
      });
      if (!ok){
        document.getElementById('koError').innerHTML = '<div class="alert-champ-danger">Todo confronto precisa terminar com um time fazendo 3 vitórias no melhor de 5 (decidindo os pênaltis quando empatar) antes de confirmar a rodada.</div>';
        return;
      }
      if (round.length === 1){
        data.knockout.champion = round[0].winnerId;
      } else {
        const next = buildNextKnockoutRound(round);
        data.knockout.rounds.push(next);
        data.knockout.currentRoundIndex++;
      }
      render();
      await trySave();
    });
  }

  boot();
})();
</script>
</body>
</html>
